[project]
name = "studyhub"
version = "0.1.0"
description = "Local-first adaptive study workspace with evidence-grounded AI workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["education", "adaptive-learning", "flask", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: browser-level end-to-end tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["app", "mcp_server", "models", "repositories", "schemas", "services"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
